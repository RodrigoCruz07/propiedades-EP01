name: CI/CD Propiedades

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Permisos minimos para el GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # 1) Compilacion + pruebas unitarias/BDD + cobertura + SonarCloud
  # ---------------------------------------------------------------
  build-test:
    name: Pruebas y análisis de calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - name: Configurar Java 21 (con caché de Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pruebas unitarias + Cucumber + umbral JaCoCo
        run: mvn -B verify

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            target/site/jacoco/
            target/cucumber/
            target/surefire-reports/
            
      # Plan gratuito: solo main permite consultar el Quality Gate.
      - name: Análisis Sonar en main (bloquea si falla el Quality Gate)
        if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Análisis Sonar en develop / PR (sin esperar el Quality Gate)
        if: github.ref != 'refs/heads/main' && github.event.pull_request.head.repo.fork != true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

  auditoria:
    name: Auditoría de cumplimiento
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21 (con caché de Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Poblar caché local de Maven (evita consultas a Maven Central)
        run: mvn -B -q dependency:resolve

      - name: Ejecutar auditoría (secretos y CVE críticas)
        run: bash audit/auditoria.sh
        

  # ---------------------------------------------------------------
  # 2) Imagen Docker + escaneo de vulnerabilidades + publicación (GHCR)
  # ---------------------------------------------------------------
  docker:
    name: Imagen Docker
    needs: [build-test, auditoria]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Definir nombre y etiqueta de la imagen (trazabilidad por commit)
        id: vars
        run: |
          IMAGE="${IMAGE_NAME,,}"          # GHCR exige minúsculas
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest"       >> "$GITHUB_OUTPUT"

      - name: Construir imagen (con etiquetas OCI de trazabilidad)
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          LATEST: ${{ steps.vars.outputs.latest }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker build \
            -t "$IMAGE" -t "$LATEST" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            .

      - name: Escaneo de vulnerabilidades de la imagen (Trivy) - bloquea si hay CRITICAL
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:latest image \
            --ignorefile /.trivyignore \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE"

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Publicar imagen
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          LATEST: ${{ steps.vars.outputs.latest }}
        run: |
          docker push "$IMAGE"
          docker push "$LATEST"

  # ---------------------------------------------------------------
  # 3) Despliegue automático en EC2 (solo rama main)
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue en EKS
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: propiedades-ep3
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Registrar hora de inicio del despliegue
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configurar credenciales de AWS (Learner Lab, temporales)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Conectar kubectl al clúster
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get nodes

      - name: Desplegar la aplicación y MySQL
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl -n propiedades create secret generic propiedades-db \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/mysql.yaml
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" k8s/app.yaml | kubectl apply -f -
          kubectl -n propiedades rollout status deployment/mysql --timeout=300s
          kubectl -n propiedades rollout status deployment/propiedades-svc --timeout=300s

      - name: Desplegar Prometheus, Pushgateway y Grafana
        run: |
          set -euo pipefail
          kubectl apply -f k8s/monitoring/00-namespace.yaml
          kubectl -n monitoring get secret grafana-admin >/dev/null \
            || { echo "Falta el Secret grafana-admin en el namespace monitoring (crearlo a mano una vez)"; exit 1; }
          kubectl -n monitoring create configmap grafana-dashboards \
            --from-file=propiedades.json=monitoring/grafana/dashboards/propiedades.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/monitoring/
          kubectl -n monitoring rollout status deployment/prometheus --timeout=300s
          kubectl -n monitoring rollout status deployment/pushgateway --timeout=300s
          kubectl -n monitoring rollout status deployment/grafana --timeout=300s


      - name: Verificar despliegue (health check por port-forward)
        run: |
          set -euo pipefail
          kubectl -n propiedades port-forward svc/propiedades-svc 8080:80 >/tmp/pf-app.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Servicio UP (verificado por port-forward)"
              exit 0
            fi
            echo "Esperando al servicio... ($i/30)"; sleep 10
          done
          kubectl -n propiedades get pods
          echo "El servicio no respondió UP"
          exit 1

      - name: Publicar tiempo de despliegue en el Pushgateway
        run: |
          set -euo pipefail
          DURATION=$(( $(date +%s) - DEPLOY_START ))
          echo "Duración del despliegue: ${DURATION}s"
          kubectl -n monitoring port-forward svc/pushgateway 9091:9091 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:9091/-/ready >/dev/null 2>&1 && break
            sleep 2
          done
          printf 'deploy_duration_seconds %s\n' "$DURATION" \
            | curl -fsS --data-binary @- http://localhost:9091/metrics/job/pipeline/servicio/propiedades-svc