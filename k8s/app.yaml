# Microservicio propiedades-svc.
# IMAGE_PLACEHOLDER lo reemplaza el pipeline por ghcr.io/<usuario>/propiedades-ep01:<sha del commit>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: propiedades-svc
  namespace: propiedades
  labels:
    app: propiedades-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: propiedades-svc
  template:
    metadata:
      labels:
        app: propiedades-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: propiedades-svc
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: PORT
              value: "8080"
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/propiedades
            - name: DB_USER
              value: propiedades
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: propiedades-db
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: propiedades-svc
  namespace: propiedades
spec:
  type: LoadBalancer
  selector:
    app: propiedades-svc
  ports:
    - port: 80
      targetPort: 8080
