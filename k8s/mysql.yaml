# Base de datos MySQL dentro del cluster (mismo enfoque que EP2: app + MySQL).
# Sin disco persistente: los datos se pierden si el pod se reinicia (aceptable para la demo).
# La contrasena NO esta en el repo: el pipeline crea el Secret "propiedades-db" desde un secret de GitHub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: propiedades
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: propiedades
            - name: MYSQL_USER
              value: propiedades
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: propiedades-db
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: propiedades-db
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u propiedades -p$MYSQL_PASSWORD --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
      volumes:
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: propiedades
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
